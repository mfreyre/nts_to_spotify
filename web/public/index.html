<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>nts-to-spotify</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Monoton&family=Major+Mono+Display&family=VT323&family=Silkscreen:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
  </div>

  <header>
    <h1><span class="logo-main">nts</span><span class="logo-arrow">&#8594;</span><span class="logo-sub">spotify</span></h1>
    <div class="auth-pills">
      <div id="auth-status" class="auth pending">checking spotify...</div>
      <div id="yt-auth-status" class="auth pending">checking youtube...</div>
    </div>
  </header>

  <main>
    <section class="card card-lime">
      <h2>scrape nts</h2>
      <div class="field">
        <label>mode</label>
        <div class="radio-group">
          <label><input type="radio" name="mode" value="episode" checked> single episode (URL)</label>
          <label><input type="radio" name="mode" value="show"> full show, one combined CSV (slug)</label>
          <label><input type="radio" name="mode" value="shows"> full show, one CSV per episode (slug)</label>
        </div>
      </div>
      <div class="field">
        <label for="nts-input" id="nts-input-label">episode URL</label>
        <input type="text" id="nts-input" placeholder="https://www.nts.live/shows/...">
      </div>
      <div class="field" id="output-field">
        <label for="nts-output">output filename (optional)</label>
        <input type="text" id="nts-output" placeholder="auto-generated if empty">
      </div>
      <button id="run-nts">generate csv &rarr;</button>
    </section>

    <section class="card card-pink">
      <h2>build the playlist</h2>
      <div class="field">
        <label>platform</label>
        <div class="radio-group">
          <label><input type="radio" name="platform" value="spotify" checked> Spotify</label>
          <label><input type="radio" name="platform" value="youtube" id="yt-radio"> YouTube</label>
        </div>
      </div>
      <div class="field">
        <label for="csv-select">pick a csv</label>
        <div class="row">
          <select id="csv-select"></select>
          <button id="refresh-csvs" class="secondary" title="Refresh list">&#8635;</button>
        </div>
      </div>
      <div class="field">
        <label for="playlist-name">playlist name</label>
        <input type="text" id="playlist-name" placeholder="my nts playlist <3">
      </div>
      <div class="field">
        <label for="playlist-desc">description (optional)</label>
        <input type="text" id="playlist-desc" placeholder="">
      </div>
      <div class="row">
        <button id="run-playlist">build playlist &rarr;</button>
        <button id="connect-spotify" class="secondary">connect spotify</button>
        <button id="connect-youtube" class="secondary" style="display:none">connect youtube</button>
      </div>
    </section>

    <section class="card card-dark log-card">
      <div class="log-header">
        <h2>live logs</h2>
        <div class="row">
          <span id="job-status"></span>
          <button id="stop-job" class="secondary" disabled>stop</button>
          <button id="clear-log" class="secondary">clear</button>
        </div>
      </div>
      <pre id="log"></pre>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
